name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: Get dependencies
      run: |
        go get -v -t -d ./...
        go mod download
        go mod verify
    
    - name: Run gofmt check
      run: bash ./scripts/gofmt.sh
    
    - name: Run tests with coverage
      run: bash ./scripts/coverage.sh
    
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
    
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v4
      with:
        version: v1.61
        args: --timeout=5m

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      security-events: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
    
    - name: Run Gosec Security Scanner
      uses: securego/gosec@v2.21.4
      with:
        args: '-no-fail -fmt sarif -out results.sarif ./...'
    
    - name: Upload SARIF file
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif

  api-test:
    name: API Integration Test
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Newman
      run: npm install -g newman

    - name: Get dependencies
      run: |
        go get -v -t -d ./...
        go mod download
    
    - name: Run API Tests
      run: bash ./scripts/run-api-tests.sh

  matrix-appsec:
    name: Boundary Matrix Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code and base history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Validate matrix catalog and bindings
      run: python3 security/matrix_ci.py validate

    - name: Check matrix gate integrity
      run: python3 -m unittest discover -s security -p 'test_matrix_gate.py'

    - name: Select matrices changed by this commit
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: python3 security/matrix_ci.py select --base "$BASE_SHA" --output "$RUNNER_TEMP/matrix-selection.json"

    - name: Build local test server
      env:
        CGO_ENABLED: '1'
      run: go build -o "$RUNNER_TEMP/realworld-app" .

    - name: Run bound and policy-observation matrix variants
      id: matrix_runtime
      continue-on-error: true
      run: python3 security/matrix_runtime.py --binary "$RUNNER_TEMP/realworld-app" --selection "$RUNNER_TEMP/matrix-selection.json" --output "$RUNNER_TEMP/matrix-runtime.json"

    - name: Check matrix sensitivity on disposable source copies
      id: matrix_sensitivity
      if: always()
      continue-on-error: true
      run: python3 security/matrix_sensitivity.py --binary "$RUNNER_TEMP/realworld-app" --selection "$RUNNER_TEMP/matrix-selection.json" --output "$RUNNER_TEMP/matrix-sensitivity.json"

    - name: Publish matrix status and enforce bound results
      if: always()
      run: python3 security/matrix_report.py --selection "$RUNNER_TEMP/matrix-selection.json" --runtime "$RUNNER_TEMP/matrix-runtime.json" --sensitivity "$RUNNER_TEMP/matrix-sensitivity.json" --json-out "$RUNNER_TEMP/matrix-status.json" --markdown-out "$RUNNER_TEMP/matrix-status.md"

    - name: Upload matrix evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: matrix-appsec-evidence
        path: |
          ${{ runner.temp }}/matrix-*.json
          ${{ runner.temp }}/matrix-status.md
        if-no-files-found: warn
